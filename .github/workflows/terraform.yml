name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipeline_run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "e48abe45-a4c4-43d1-a40c-27194aa427aa" \
            --password "cMa8Q~4X9olqJ5WlGJg~dH3uwwBVCrMgmn5aFaOQ" \
            --tenant "2fc99489-a777-4ba0-a3e7-a56465285d7c"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "6932cb51-3b2e-46ad-879e-55855b137854"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: pipeline_run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "e48abe45-a4c4-43d1-a40c-27194aa427aa" \
            --password "cMa8Q~4X9olqJ5WlGJg~dH3uwwBVCrMgmn5aFaOQ" \
            --tenant "2fc99489-a777-4ba0-a3e7-a56465285d7c"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "6932cb51-3b2e-46ad-879e-55855b137854"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan